<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>设备维保资料的适配收集与离线交接</title><style>body{font:16px system-ui;max-width:1100px;margin:24px auto;color:#172333}button,input,select,textarea{font:inherit;margin:6px;padding:7px}#viewport{height:210px;overflow:auto;border:1px solid #8a99aa;position:relative}#spacer{position:relative}#rows{position:absolute;left:0;right:0;top:0}.row{height:64px;box-sizing:border-box;border-bottom:1px solid #ddd;padding:8px;background:white}pre{white-space:pre-wrap;background:#f1f4f7;padding:15px}fieldset{margin:18px 0}label{display:inline-block}</style><h1>设备维保资料的适配收集与离线交接</h1><p>本地虚构业务资料；页面显示的来源记录与接收回执由演练系统维护。</p><p id="revision"></p><label>资料分类<select id="collection" aria-label="资料分类"></select></label><button id="refresh">刷新资料</button><p id="coverage"></p><div id="viewport" role="table" aria-label="来源条目"><div id="spacer"><div id="rows"></div></div></div><section><h2>条目详情</h2><pre id="detail" aria-label="条目详情">请选择条目</pre><div id="media"></div></section><fieldset><legend>来源系统办理</legend><label>操作<select id="operation" aria-label="办理操作"></select></label><label>对象编号<input id="object" aria-label="对象编号"></label><label>请求编号<input id="request" aria-label="请求编号"></label><label>依据版本<input id="expected" aria-label="依据版本" type="number"></label><label>办理资料<textarea id="payload" aria-label="办理资料">{}</textarea></label><label><input type="checkbox" id="drop">提交后模拟连接中断</label><button id="submit">提交办理</button><button id="lookup">查询回执</button><pre id="result" aria-label="办理结果"></pre></fieldset><fieldset id="draft-controls" hidden><legend>平板本地草稿</legend><label>检查项<input id="draft-id" aria-label="草稿检查项"></label><label>观测语义<select id="meaning"><option value="value">已填写</option><option value="clear">明确清空</option><option value="missing">未填写</option><option value="carry">沿用上次值</option></select></label><label>观测值<input id="draft-value"></label><button id="save-draft">保存本地草稿</button><button id="show-draft">查看本地草稿</button><button id="seed-draft">载入演练草稿</button><button id="sync-draft">同步所选草稿</button><pre id="draft-output"></pre></fieldset><fieldset><legend>演练情景</legend><select id="change" aria-label="演练变化"></select><button id="apply-change">应用变化</button><pre id="change-result"></pre></fieldset><script>
let meta=null,rows=[],total=0,revision=null,loaded=new Set();let uiGeneration=0;
const el=id=>document.getElementById(id);const request=async(path,options)=>{const r=await fetch(path,options);const v=await r.json();if(!r.ok)throw Error(JSON.stringify(v));return v};
async function loadPage(start,generation){const name=el('collection').value;if(loaded.has(start))return;loaded.add(start);const page=await request('/source-list?name='+encodeURIComponent(name)+'&offset='+start);if(generation!==uiGeneration)return;if(page.revision!==revision){el('coverage').textContent='资料版本已改变，请刷新后继续';return}page.items.forEach((v,i)=>rows[start+i]=v);render()}
function render(){const from=Math.min(Math.max(0,Math.floor(el('viewport').scrollTop/64)),Math.max(0,total-1));el('rows').style.transform='translateY('+(from*64)+'px)';el('rows').replaceChildren();for(let i=from;i<Math.min(from+4,total);i++){let row=rows[i];if(!row){loadPage(Math.floor(i/2)*2,uiGeneration);continue}let d=document.createElement('div');d.className='row';d.setAttribute('role','row');d.setAttribute('aria-rowindex',String(i+1));d.dataset.id=row.id;let b=document.createElement('button');b.textContent=row.name||row.label||row.id;b.setAttribute('aria-label','查看 '+row.id);b.onclick=async()=>{row=(await request('/source-detail?name='+encodeURIComponent(el('collection').value)+'&id='+encodeURIComponent(row.id))).item;el('detail').textContent=JSON.stringify(row,null,2);el('object').value=row.id;el('media').replaceChildren();for(let f of row.files||[]){let a=document.createElement('a');a.href=f;a.textContent='原件 '+f;a.download='';el('media').append(a)}if(row.image){let im=document.createElement('img');im.src=row.image;im.alt='位置 '+row.id+' 合成巡检图';im.width=320;el('media').append(im)}};d.append(document.createTextNode((i+1)+' '),b);el('rows').append(d)}el('coverage').textContent='总行数 '+total+'；已加载 '+rows.filter(Boolean).length+'；查询 '+el('collection').value+'；版本 '+revision}
async function refresh(){uiGeneration++;const g=uiGeneration;meta=await request('/source-meta');revision=meta.revision;el('revision').textContent='资料版本 '+revision;el('expected').value=revision;total=meta.collections.find(x=>x.name===el('collection').value)?.total||0;el('spacer').style.height=(total*64)+'px';el('viewport').setAttribute('aria-rowcount',String(total));el('viewport').scrollTop=0;rows=[];loaded.clear();await loadPage(0,g)}
el('viewport').onscroll=render;el('refresh').onclick=refresh;el('collection').onchange=refresh;
el('submit').onclick=async()=>{try{const result=await request('/source-action',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({request_key:el('request').value,object_id:el('object').value,operation:el('operation').value,expected_revision:Number(el('expected').value),payload:JSON.parse(el('payload').value),drop_response:el('drop').checked})});el('result').textContent=JSON.stringify(result,null,2)}catch(e){el('result').textContent='办理结果尚未确认：'+e.message}};
el('lookup').onclick=async()=>el('result').textContent=JSON.stringify(await request('/receipt?request='+encodeURIComponent(el('request').value)),null,2);
el('apply-change').onclick=async()=>{el('change-result').textContent=JSON.stringify(await request('/exercise',{method:'POST',body:JSON.stringify({id:el('change').value})}));await refresh()};
el('save-draft').onclick=()=>{let all=JSON.parse(localStorage.getItem('inspection-drafts')||'{}');all[el('draft-id').value]={...(all[el('draft-id').value]||{}),id:el('draft-id').value,meaning:el('meaning').value,value:el('draft-value').value,observed_at:new Date().toISOString(),state:'local'};localStorage.setItem('inspection-drafts',JSON.stringify(all));el('draft-output').textContent='仅保存在此浏览器；尚未收到服务商接收回执'};
el('show-draft').onclick=()=>el('draft-output').textContent=localStorage.getItem('inspection-drafts')||'{}';
el('seed-draft').onclick=()=>{let all=JSON.parse(localStorage.getItem('inspection-drafts')||'{}');for(let d of [])if(!all[d.id])all[d.id]=d;localStorage.setItem('inspection-drafts',JSON.stringify(all));el('draft-output').textContent=JSON.stringify(all,null,2)};
el('sync-draft').onclick=async()=>{let all=JSON.parse(localStorage.getItem('inspection-drafts')||'{}');let d=all[el('draft-id').value];if(!d){el('draft-output').textContent='请选择已有草稿';return}try{let result=await request('/source-action',{method:'POST',body:JSON.stringify({operation:'sync_observation',object_id:d.task+'|'+d.device+'|'+d.field,request_key:el('request').value,expected_revision:Number(el('expected').value),payload:d,drop_response:el('drop').checked})});d.state=result.status;d.provider_receipt=result.receipt_id;localStorage.setItem('inspection-drafts',JSON.stringify(all));el('draft-output').textContent=JSON.stringify(result,null,2)}catch(e){el('draft-output').textContent='未确认接收：'+e.message}};

(async()=>{meta=await request('/source-meta');meta.collections.forEach(x=>el('collection').add(new Option(x.name,x.name)));meta.operations.forEach(x=>el('operation').add(new Option(x,x)));meta.changes.forEach(x=>el('change').add(new Option(x.label,x.id)));await refresh()})().catch(e=>el('coverage').textContent='读取失败 '+e.message);
</script></html>
